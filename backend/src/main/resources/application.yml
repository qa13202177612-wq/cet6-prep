server:
  port: 8080
  servlet:
    session:
      timeout: 7d

spring:
  application:
    name: cet6-server
  datasource:
    url: jdbc:mysql://localhost:3306/cet6?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: "${DB_PASSWORD:123456}"   # 环境变量注入,默认值仅为本地方便
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

# 千问 MaaS AI 批改配置(与简记 App 同一套接口,M4 模块启用)
cet6:
  ai:
    enabled: false
    api-key: ""
    base-url: ""
    model: ""
